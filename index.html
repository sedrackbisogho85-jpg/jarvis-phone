<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* ===================== EDIT HERE =====================
   This repo is PUBLIC, so leave the key and the numbers EMPTY when you push.
   Type them in Settings on the phone instead. They stay on the phone only. */
const GROQ_API_KEY = "";                    // leave empty on GitHub
const GROQ_MODEL = "openai/gpt-oss-20b";    // the model your Groq account accepts
const CONTACTS = {                          // names in small letters, leave empty on GitHub
  // mum: "+256700000000",
  // dad: "+256700000000",
  // me: "+256700000000"
};
/* Apps JARVIS may open: name: [what he calls it, Android package name].
   These are Samsung package names. No websites are ever opened. */
const APP_PACKAGES = {
  whatsapp:   ["WhatsApp",   "com.whatsapp"],
  boomplay:   ["Boomplay",   "com.afmobi.boomplayer"],
  youtube:    ["YouTube",    "com.google.android.youtube"],
  camera:     ["Camera",     "com.sec.android.app.camera"],
  gallery:    ["Gallery",    "com.sec.android.gallery3d"],
  maps:       ["Maps",       "com.google.android.apps.maps"],
  chrome:     ["Chrome",     "com.android.chrome"],
  phone:      ["Phone",      "com.samsung.android.dialer"],
  messages:   ["Messages",   "com.samsung.android.messaging"],
  gmail:      ["Gmail",      "com.google.android.gm"],
  telegram:   ["Telegram",   "org.telegram.messenger"],
  facebook:   ["Facebook",   "com.facebook.katana"],
  instagram:  ["Instagram",  "com.instagram.android"],
  tiktok:     ["TikTok",     "com.zhiliaoapp.musically"],
  settings:   ["Settings",   "com.android.settings"],
  calculator: ["Calculator", "com.sec.android.app.popupcalculator"],
  files:      ["My Files",   "com.sec.android.app.myfiles"],
  playstore:  ["Play Store", "com.android.vending"]
};
/* ===================================================== */
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031a1d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>JARVIS</title>
<style>
  :root { --c:#35d6d6; }
  body[data-state="error"] { --c:#ff3b3b; }
  * { box-sizing:border-box; }
  html, body {
    margin:0; height:100%; overflow:hidden; background:#031a1d; color:#d6f3f3;
    font-family:system-ui, sans-serif; -webkit-tap-highlight-color:transparent;
  }
  #app {
    display:flex; flex-direction:column; height:100%;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    background:radial-gradient(circle at 50% 30%, #07363b 0%, #031a1d 45%, #000 85%);
  }
  header {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 12px; border-bottom:2px solid var(--c);
    background:linear-gradient(rgba(53,214,214,.16), rgba(0,0,0,0));
  }
  h1 { margin:0; font-size:17px; letter-spacing:6px; font-weight:400; color:#e6fafa; text-shadow:0 0 12px var(--c); }
  .hbtns { display:flex; gap:6px; align-items:center; }
  button {
    font:inherit; color:var(--c); background:rgba(2,26,30,.75);
    border:1px solid var(--c); border-radius:12px; padding:10px 12px;
  }
  button:active { background:rgba(53,214,214,.28); }
  button.small { padding:6px 10px; font-size:13px; }
  button.on { background:rgba(53,214,214,.25); box-shadow:0 0 10px var(--c); }
  #net {
    display:none; font-size:11px; letter-spacing:2px; color:#ffb347;
    border:1px solid #ffb347; border-radius:20px; padding:3px 8px;
  }
  #stage { flex:1; position:relative; min-height:180px; }
  #orb { position:absolute; inset:0; width:100%; height:100%; }
  #state {
    position:absolute; top:8px; left:12px; font-size:11px; letter-spacing:3px; color:var(--c);
    border:1px solid rgba(53,214,214,.5); border-radius:20px; padding:3px 10px;
  }
  #chat {
    height:22vh; overflow-y:auto; padding:8px 12px; font-size:14px;
    background:rgba(2,26,30,.72); border-top:1px solid rgba(53,214,214,.4);
  }
  .msg { margin:6px 0; white-space:pre-wrap; user-select:text; }
  .who { color:var(--c); font-weight:700; }
  #tapBtn {
    display:none; position:fixed; left:50%; transform:translateX(-50%); z-index:4;
    bottom:calc(170px + env(safe-area-inset-bottom));
    padding:16px 24px; font-size:17px; border-radius:30px; max-width:90%;
    background:rgba(3,40,45,.96); box-shadow:0 0 22px var(--c);
  }
  #chips { display:flex; gap:6px; overflow-x:auto; padding:8px 10px 4px; background:rgba(2,26,30,.9); }
  .chip { flex:0 0 auto; padding:8px 12px; font-size:13px; letter-spacing:1px; }
  #bar { padding:6px 10px 8px; background:rgba(2,26,30,.9); }
  .row { display:flex; gap:6px; }
  .row + .row { margin-top:6px; }
  .row button { flex:1; padding:11px 4px; font-size:14px; }
  #text {
    flex:1; min-width:0; font:inherit; color:#e6f6f6; background:#02181b;
    border:1px solid rgba(53,214,214,.5); border-radius:12px; padding:10px;
  }
  #sendBtn { flex:0 0 auto; padding:10px 16px; }
  #settings {
    position:fixed; inset:0; z-index:5; display:none; overflow:auto;
    padding:18px; background:rgba(3,26,29,.98);
  }
  #settings h2 { margin:0; color:var(--c); font-weight:400; letter-spacing:3px; }
  #settings label { display:block; margin:14px 0 4px; color:var(--c); font-size:13px; letter-spacing:1px; }
  #settings input, #settings select, #settings textarea {
    width:100%; font:inherit; color:#e6f6f6; background:#02181b;
    border:1px solid rgba(53,214,214,.5); border-radius:12px; padding:10px;
  }
  #settings textarea { min-height:90px; }
  #settings p { font-size:12px; opacity:.8; }
</style>
</head>
<body data-state="idle">
<div id="app">
  <header>
    <h1>J.A.R.V.I.S.</h1>
    <div class="hbtns">
      <span id="net">OFFLINE</span>
      <button id="wakeBtn" class="small">Wake: Off</button>
      <button id="gear" class="small">Settings</button>
    </div>
  </header>
  <div id="stage"><canvas id="orb"></canvas><div id="state">IDLE</div></div>
  <div id="chat"></div>
  <button id="tapBtn"></button>
  <div id="chips"></div>
  <div id="bar">
    <div class="row">
      <button id="talkBtn">Talk</button>
      <button id="musicBtn">Play Music</button>
      <button id="callBtn">Call</button>
      <button id="lookBtn">Look</button>
      <button id="readBtn">Read</button>
    </div>
    <div class="row">
      <input id="text" placeholder="Type to JARVIS" autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<div id="settings">
  <h2>SETTINGS</h2>
  <label>Groq key (stays on this phone only)</label>
  <input id="setKey" type="password" autocomplete="off" placeholder="paste your Groq key">
  <label>Chat model</label>
  <input id="setModel" type="text" autocomplete="off">
  <label>Contacts (one per line, like: mum = +256700000000)</label>
  <textarea id="setContacts" placeholder="mum = +256700000000&#10;dad = +256700000000&#10;me = +256700000000"></textarea>
  <label>Listening language (try another if he mishears you)</label>
  <select id="setLang">
    <option value="en-KE">English (Kenya)</option>
    <option value="en-UG">English (Uganda)</option>
    <option value="en-TZ">English (Tanzania)</option>
    <option value="en-NG">English (Nigeria)</option>
    <option value="en-ZA">English (South Africa)</option>
    <option value="en-GB">English (UK)</option>
    <option value="en-US">English (US)</option>
  </select>
  <label>Camera</label>
  <select id="setCam">
    <option value="environment">Back camera</option>
    <option value="user">Front camera</option>
  </select>
  <p>Your key and contacts are saved only in this browser on this phone. Use a separate Groq key for the phone, so you can cancel it if the phone is lost.</p>
  <div class="row" style="margin-top:16px">
    <button id="saveBtn">Save</button>
    <button id="closeBtn">Close</button>
  </div>
  <p id="setNote"></p>
</div>

<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }

  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  // ---------- saved settings (kept on this phone only) ----------
  var store = {
    get: function (key, fallback) {
      try { var v = localStorage.getItem(key); return v === null ? fallback : v; }
      catch (e) { return fallback; }
    },
    set: function (key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }
  };
  var cfg = {
    key: store.get("jv_key", "") || GROQ_API_KEY,
    model: store.get("jv_model", "") || GROQ_MODEL,
    lang: store.get("jv_lang", "en-KE"),
    cam: store.get("jv_cam", "environment")
  };

  var APPS = {};
  Object.keys(APP_PACKAGES).forEach(function (k) {
    APPS[k] = { label: APP_PACKAGES[k][0], pkg: APP_PACKAGES[k][1] };
  });

  var VISION_MODELS = [
    "qwen/qwen3.8-27b",
    "qwen/qwen3.6-27b",
    "meta-llama/llama-4-scout-17b-16e-instruct"
  ];
  var LOOK_PROMPT =
    "You are the eyes of JARVIS, a voice assistant. Answer in three to five " +
    "short, natural spoken sentences. No lists and no symbols. Say only what " +
    "you can actually see, and say so if something is unclear.";
  var READ_PROMPT =
    "Read all the text visible in this picture and write it out exactly as " +
    "written, line by line, in the same order. Do not add comments, " +
    "descriptions or markdown. If there is no readable text, reply with " +
    "exactly: NO TEXT";

  function systemPrompt() {
    return "You are Jarvis, a witty personal AI assistant. Keep answers short, " +
      "fun, and helpful. If user asks to open an app, play music, or call " +
      "someone, reply ONLY with a special command like OPEN whatsapp or PLAY " +
      "song name or CALL mum. Never add any other words to a command. The " +
      "apps you can open are " + Object.keys(APPS).join(", ") + ". " +
      "Otherwise address the user as sir now and then, and never use lists " +
      "or symbols, because your words are spoken aloud. " +
      "The current date and time is " + new Date().toLocaleString() + ".";
  }

  // ---------- screen basics ----------
  var talking = false;
  var currentRec = null;
  var speaking = false;
  var lastSpoken = "";      // what JARVIS said last, so he can ignore his own echo
  var history = [];
  var pending = null;       // what JARVIS is waiting to hear: a song, a name, a number
  var silentReply = false;  // true when an app opened, so the reply is not spoken

  function setState(name) {
    document.body.dataset.state = name;
    $("state").textContent = name.toUpperCase();
  }

  function addMessage(who, text) {
    var chat = $("chat");
    var row = document.createElement("div");
    row.className = "msg";
    var name = document.createElement("span");
    name.className = "who";
    name.textContent = who + ": ";
    row.appendChild(name);
    row.appendChild(document.createTextNode(text));
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  // ---------- online or offline ----------
  function showNet() {
    $("net").style.display = navigator.onLine ? "none" : "inline-block";
  }
  window.addEventListener("online", showNet);
  window.addEventListener("offline", showNet);
  showNet();

  function needInternet() {
    if (navigator.onLine) { return; }
    var e = new Error("I am offline, sir. I can still open apps, call, play music and keep your tasks and notes. Chat and vision need the internet.");
    e.friendly = true;
    throw e;
  }

  // ---------- Groq ----------
  async function groqChat(model, messages, maxTokens) {
    var res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + cfg.key
      },
      body: JSON.stringify({ model: model, messages: messages, max_tokens: maxTokens || 500 })
    });
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      var err = new Error((data.error && data.error.message) || ("HTTP " + res.status));
      err.status = res.status;
      throw err;
    }
    var text = (data.choices && data.choices[0] && data.choices[0].message &&
                data.choices[0].message.content) || "";
    return text.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  }

  function friendlyError(e) {
    if (e && e.friendly) { return e.message; }
    if (e && e.status === 401) { return "Your Groq key was rejected. Open settings and check it, sir."; }
    if (e && e.status === 429) { return "The rate limit was reached. Wait a little and try again, sir."; }
    if (e && (e.status === 400 || e.status === 404)) {
      return "That model name was not accepted. Open settings and change the chat model, sir.";
    }
    if (e && e.name === "TypeError") { return "I cannot reach Groq. Check your internet, sir."; }
    return "Something went wrong, sir. " + ((e && e.message) || "");
  }

  async function ask(text) {
    needInternet();
    history.push({ role: "user", content: text });
    if (history.length > 16) { history.splice(0, history.length - 16); }
    var messages = [{ role: "system", content: systemPrompt() }].concat(history);
    var answer;
    try {
      answer = await groqChat(cfg.model, messages, 500);
    } catch (e) {
      history.pop();
      throw e;
    }
    // The AI answers a command like OPEN whatsapp: do it, never show the code
    var done = await interpretCommand(answer);
    var reply = done !== null ? done : answer;
    history.push({ role: "assistant", content: reply });
    return reply;
  }

  async function vision(picture, prompt, maxTokens) {
    var content = [
      { type: "text", text: prompt },
      { type: "image_url", image_url: { url: "data:image/jpeg;base64," + picture } }
    ];
    var remembered = store.get("jv_vision", "");
    var order = (remembered ? [remembered] : []).concat(
      VISION_MODELS.filter(function (m) { return m !== remembered; })
    );
    var last = null;
    for (var i = 0; i < order.length; i++) {
      try {
        var text = await groqChat(order[i], [{ role: "user", content: content }], maxTokens);
        if (text) { store.set("jv_vision", order[i]); return text; }
      } catch (e) {
        if (e.status === 401 || e.status === 429 || e.name === "TypeError") { throw e; }
        last = e;
      }
    }
    var fail = new Error("None of the vision models answered, sir. " + ((last && last.message) || ""));
    fail.friendly = true;
    throw fail;
  }

  // ---------- opening apps: launcher intents only, never a website ----------
  function launcherUrl(pkg) {
    return "intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=" + pkg + ";end";
  }

  // Android allows an app launch only just after a touch
  function canLaunch() {
    return !navigator.userActivation || navigator.userActivation.isActive;
  }

  // Starts the link. Answers true when the page left the screen (the app opened).
  function launch(url) {
    return new Promise(function (resolve) {
      var left = false;
      function onHide() { if (document.hidden) { left = true; } }
      function onBlur() { left = true; }
      document.addEventListener("visibilitychange", onHide);
      window.addEventListener("blur", onBlur);
      window.location.href = url;
      setTimeout(function () {
        document.removeEventListener("visibilitychange", onHide);
        window.removeEventListener("blur", onBlur);
        resolve(left || document.hidden);
      }, 1800);
    });
  }

  var NOT_INSTALLED = "Sorry sir, that app is not installed.";

  function notInstalled() {
    addMessage("JARVIS", NOT_INSTALLED);
    speak(NOT_INSTALLED);
  }

  // One big button, for when Android wants a touch first
  var tapRun = null;
  var tapTimer = null;
  function hideTap() {
    $("tapBtn").style.display = "none";
    tapRun = null;
  }
  function offerTap(text, run) {
    tapRun = run;
    $("tapBtn").textContent = text;
    $("tapBtn").style.display = "block";
    clearTimeout(tapTimer);
    tapTimer = setTimeout(hideTap, 20000);
  }
  $("tapBtn").addEventListener("click", function () {
    var run = tapRun;
    hideTap();
    if (run) { run(); }
  });

  var APP_ALIASES = {
    "wa": "whatsapp", "whats app": "whatsapp", "boom play": "boomplay",
    "you tube": "youtube", "yt": "youtube", "map": "maps", "google maps": "maps",
    "photos": "gallery", "pictures": "gallery", "photo gallery": "gallery",
    "camera app": "camera", "browser": "chrome", "google chrome": "chrome", "google": "chrome",
    "dialer": "phone", "phone app": "phone", "sms": "messages", "texts": "messages",
    "messaging": "messages", "mail": "gmail", "email": "gmail", "e mail": "gmail",
    "tg": "telegram", "setting": "settings", "calc": "calculator",
    "my files": "files", "file manager": "files", "play store": "playstore",
    "google play": "playstore", "store": "playstore"
  };

  function appKey(spoken) {
    var s = String(spoken).toLowerCase().replace(/[^a-z ]/g, " ")
      .replace(/\b(the|my|app|application)\b/g, " ").replace(/\s+/g, " ").trim();
    if (APPS[s]) { return s; }
    if (APP_ALIASES[s]) { return APP_ALIASES[s]; }
    return "";
  }

  async function openApp(spoken) {
    var key = appKey(spoken);
    if (!key) {
      return "I do not know that app, sir. I can open " +
        Object.keys(APPS).map(function (k) { return APPS[k].label; }).join(", ") + ".";
    }
    var app = APPS[key];
    var url = launcherUrl(app.pkg);
    if (!canLaunch()) {
      offerTap("Tap to open " + app.label, function () {
        launch(url).then(function (ok) { if (!ok) { notInstalled(); } });
      });
      return "Android needs one tap from you for that, sir. Tap the button to open " + app.label + ".";
    }
    var ok = await launch(url);
    if (ok) { silentReply = true; return "Opening " + app.label + ", sir."; }
    return NOT_INSTALLED;
  }

  // ---------- music on Boomplay ----------
  function cleanSong(text) {
    return String(text).replace(/\b(on boomplay|on boom play|please|for me)\b/gi, " ")
      .replace(/^(some|a|the|me)\s+/i, "").replace(/["']/g, "").replace(/\s+/g, " ").trim();
  }

  // Search inside the Boomplay app. No website is ever opened.
  async function launchMusic(song) {
    var pkg = APPS.boomplay.pkg;
    var search = "intent://www.boomplay.com/search/default/" + encodeURIComponent(song) +
      "#Intent;scheme=https;package=" + pkg + ";end";
    var ok = await launch(search);
    if (ok) { silentReply = true; return "Playing " + song + " on Boomplay, sir."; }
    var ok2 = await launch(launcherUrl(pkg));
    if (ok2) {
      silentReply = true;
      return "I opened Boomplay, sir, but it would not take the search. Please search for " + song + " there.";
    }
    return NOT_INSTALLED;
  }

  async function playMusic(song) {
    song = cleanSong(song);
    if (!song || /^(music|songs?|something|a song|some music)$/i.test(song)) {
      pending = { type: "song", at: Date.now() };
      return "What should I play, sir?";
    }
    if (!canLaunch()) {
      offerTap("Tap to play " + song + " on Boomplay", function () {
        launchMusic(song).then(function (text) {
          var quiet = silentReply;
          silentReply = false;
          addMessage("JARVIS", text);
          if (!quiet) { speak(text); }
        });
      });
      return "Android needs one tap from you for that, sir. Tap the button to play " + song + ".";
    }
    return await launchMusic(song);
  }

  // ---------- calling contacts ----------
  var CONTACT_ALIASES = {
    mom: "mum", mommy: "mum", mother: "mum", mama: "mum", mummy: "mum",
    father: "dad", papa: "dad", daddy: "dad", myself: "me"
  };

  var NUMBER_WORDS = {
    zero: "0", oh: "0", o: "0", one: "1", two: "2", three: "3", four: "4",
    five: "5", six: "6", seven: "7", eight: "8", nine: "9", plus: "+"
  };

  // "zero seven zero zero" becomes "0 7 0 0"
  function spokenDigits(text) {
    return String(text).toLowerCase().split(/\s+/).map(function (w) {
      w = w.replace(/[.,!?]/g, "");
      return NUMBER_WORDS.hasOwnProperty(w) ? NUMBER_WORDS[w] : w;
    }).join(" ");
  }

  function contactKey(spoken) {
    var s = String(spoken).toLowerCase().replace(/[^a-z ]/g, " ")
      .replace(/\b(my|the|please)\b/g, " ").replace(/\s+/g, " ").trim();
    return CONTACT_ALIASES[s] || s;
  }

  function savedContacts() {
    try { return JSON.parse(store.get("jv_contacts", "{}")) || {}; } catch (e) { return {}; }
  }

  function allContacts() {
    var out = {};
    Object.keys(CONTACTS).forEach(function (k) { out[k.toLowerCase()] = String(CONTACTS[k]); });
    var saved = savedContacts();
    Object.keys(saved).forEach(function (k) { out[k.toLowerCase()] = String(saved[k]); });
    return out;
  }

  function callContact(spoken) {
    var key = contactKey(spoken);
    if (!key) { pending = { type: "call", at: Date.now() }; return "Who should I call, sir?"; }
    var label = key.charAt(0).toUpperCase() + key.slice(1);
    var number = allContacts()[key];
    if (!number) {
      pending = { type: "number", name: key, at: Date.now(), tries: 0 };
      return "What is " + label + "'s number, sir? You can also say cancel.";
    }
    var href = "tel:" + number.replace(/[^\d+]/g, "");
    if (!canLaunch()) {
      offerTap("Tap to call " + label, function () { window.location.href = href; });
      return "Android needs one tap from you for that, sir. Tap the button to call " + label + ".";
    }
    window.location.href = href;
    return "Calling " + label + " now, sir.";
  }

  function saveNumberAndCall(name, text) {
    var digits = spokenDigits(text).replace(/[^\d+]/g, "");
    var saved = savedContacts();
    saved[name] = digits;
    store.set("jv_contacts", JSON.stringify(saved));
    return callContact(name);
  }

  // The AI's special commands: OPEN xxx, PLAY xxx, CALL xxx
  async function interpretCommand(reply) {
    var line = String(reply).replace(/[`"']/g, "").trim();
    if (line.indexOf("\n") >= 0 || line.length > 90) { return null; }
    var m = line.match(/^(OPEN|PLAY|CALL)\s+(.+)$/);
    if (!m) { return null; }
    if (m[1] === "OPEN") { return await openApp(m[2]); }
    if (m[1] === "PLAY") { return await playMusic(m[2]); }
    return callContact(m[2]);
  }

  // ---------- speaking ----------
  function pickVoice() {
    if (!window.speechSynthesis) { return null; }
    var voices = speechSynthesis.getVoices();
    var uk = voices.filter(function (v) { return /en[-_]GB/i.test(v.lang); });
    var male = uk.filter(function (v) { return /male/i.test(v.name) && !/female/i.test(v.name); });
    var any = voices.filter(function (v) { return /^en/i.test(v.lang); });
    return male[0] || uk[0] || any[0] || null;
  }

  function speakable(text) {
    return String(text)
      .split("\n\nSources:")[0]
      .replace(/https?:\/\/\S+/g, "")
      .replace(/[*#`_>|]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function speakChunk(text) {
    return new Promise(function (resolve) {
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "en-GB"; }
      u.pitch = 0.6;
      u.rate = 1.0;
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  }

  async function speak(text) {
    var clean = speakable(text);
    if (!clean || !window.speechSynthesis) { return; }
    lastSpoken = clean;
    var parts = clean.match(/[^.!?]+[.!?]*/g) || [clean];
    speechSynthesis.cancel();
    speaking = true;
    for (var i = 0; i < parts.length && speaking; i++) {
      var piece = parts[i].trim();
      if (piece) { await speakChunk(piece); }
    }
    speaking = false;
  }

  function stopSpeaking() {
    speaking = false;
    if (window.speechSynthesis) { speechSynthesis.cancel(); }
  }

  // True when the microphone only heard JARVIS's own voice
  function isEcho(text) {
    var heard = String(text).toLowerCase().replace(/[^a-z ]/g, " ").split(/\s+/).filter(Boolean);
    if (heard.length < 3 || !lastSpoken) { return false; }
    var said = {};
    lastSpoken.toLowerCase().replace(/[^a-z ]/g, " ").split(/\s+/).forEach(function (w) { said[w] = true; });
    var hits = heard.filter(function (w) { return said[w]; }).length;
    return hits / heard.length >= 0.7;
  }

  // ---------- listening ----------
  function listenOnce() {
    return new Promise(function (resolve) {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { resolve({ error: "nosupport" }); return; }
      var rec = new SR();
      rec.lang = cfg.lang;
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.continuous = false;
      var done = false;
      function finish(result) {
        if (done) { return; }
        done = true;
        try { rec.stop(); } catch (e) {}
        resolve(result);
      }
      rec.onresult = function (e) { finish({ text: e.results[0][0].transcript }); };
      rec.onerror = function (e) { finish({ error: e.error }); };
      rec.onend = function () { finish({ error: "no-speech" }); };
      currentRec = rec;
      try { rec.start(); } catch (e) { finish({ error: "start-failed" }); }
    });
  }

  // ---------- optional "Hey Jarvis" listening ----------
  var wakeOn = false;
  var wakeRec = null;

  function setWakeButton() {
    $("wakeBtn").textContent = wakeOn ? "Wake: On" : "Wake: Off";
    $("wakeBtn").className = "small" + (wakeOn ? " on" : "");
  }

  function stopWake() {
    var r = wakeRec;
    wakeRec = null;
    try { if (r) { r.onend = null; r.abort(); } } catch (e) {}
  }

  function resumeWake() {
    if (wakeOn && !wakeRec && !talking && !speaking) { startWake(); }
  }

  function startWake() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      addMessage("JARVIS", "This browser cannot listen for the wake word. Use Chrome, sir.");
      wakeOn = false;
      setWakeButton();
      return;
    }
    if (wakeRec) { return; }
    var rec = new SR();
    rec.lang = cfg.lang;
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (!e.results[i].isFinal) { continue; }
        var heard = e.results[i][0].transcript.toLowerCase();
        var m = heard.match(/\bjarvis\b[,.!?\s]*(.*)$/);
        if (m) { onWake(m[1].trim()); return; }
      }
    };
    rec.onerror = function (e) {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        wakeOn = false;
        setWakeButton();
        addMessage("JARVIS", "The microphone is blocked, so the wake word is off, sir.");
      }
    };
    rec.onend = function () {
      wakeRec = null;
      if (wakeOn && !talking && !speaking) { setTimeout(resumeWake, 400); }
    };
    wakeRec = rec;
    try { rec.start(); } catch (e) { wakeRec = null; }
  }

  async function onWake(rest) {
    if (talking) { return; }
    stopWake();
    if (rest) { await handleText(rest); }
    else { await conversation(); }
    resumeWake();
  }

  // ---------- tasks and notes (saved on this phone) ----------
  function loadList(key) {
    try { return JSON.parse(store.get(key, "[]")) || []; } catch (e) { return []; }
  }
  function saveList(key, list) { store.set(key, JSON.stringify(list)); }

  function addTask(text) {
    var list = loadList("jv_tasks");
    list.push(text.trim());
    saveList("jv_tasks", list);
    return "Added to your tasks, sir: " + text.trim() + ".";
  }
  function listTasks() {
    var list = loadList("jv_tasks");
    if (!list.length) { return "You have no open tasks, sir."; }
    return "You have " + list.length + " open " + (list.length === 1 ? "task" : "tasks") + ". " +
      list.map(function (t, i) { return "Number " + (i + 1) + ", " + t + "."; }).join(" ");
  }
  function finishTask(n) {
    var list = loadList("jv_tasks");
    if (n < 1 || n > list.length) { return "I do not have a task number " + n + ", sir."; }
    var gone = list.splice(n - 1, 1)[0];
    saveList("jv_tasks", list);
    return "Done, sir. I removed: " + gone + ".";
  }
  function addNote(text) {
    var list = loadList("jv_notes");
    list.push(text.trim());
    saveList("jv_notes", list);
    return "Note saved, sir.";
  }
  function listNotes() {
    var list = loadList("jv_notes");
    if (!list.length) { return "You have no notes yet, sir."; }
    return "Your latest notes: " + list.slice(-3).join(". ") + ".";
  }

  // ---------- camera ----------
  async function grabPicture(maxSide) {
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: cfg.cam }, width: { ideal: 1600 } },
        audio: false
      });
    } catch (e) {
      var denied = new Error("I could not open the camera. Allow camera access for this app, sir.");
      denied.friendly = true;
      throw denied;
    }
    try {
      var video = document.createElement("video");
      video.setAttribute("playsinline", "");
      video.muted = true;
      video.srcObject = stream;
      await video.play();
      await new Promise(function (r) { setTimeout(r, 900); });
      var w = video.videoWidth, h = video.videoHeight;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
    } finally {
      stream.getTracks().forEach(function (t) { t.stop(); });
    }
  }

  function cut(text) {
    if (text.length <= 600) { return text; }
    var piece = text.slice(0, 600);
    var end = Math.max(piece.lastIndexOf(". "), piece.lastIndexOf("\n"), piece.lastIndexOf(" "));
    return piece.slice(0, end > 200 ? end : 600).trim() + " and so on.";
  }

  async function camera(kind, userText) {
    needInternet();
    if (!cfg.key) { var e0 = new Error("Add your Groq key in settings first, sir."); e0.friendly = true; throw e0; }
    setState("thinking");
    if (kind === "look") {
      var picture = await grabPicture(1024);
      var seen = await vision(picture, LOOK_PROMPT + " Sir's request: " + (userText || "Describe what you see."), 400);
      history.push({ role: "assistant", content: "I looked through the camera and saw: " + seen });
      return seen;
    }
    var page = await grabPicture(1600);
    var text = await vision(page, READ_PROMPT, 1200);
    if (/^NO TEXT/i.test(text)) {
      return "I could not find any readable text, sir. Hold it closer, steady, and in good light.";
    }
    var lowered = (userText || "").toLowerCase();
    var parts = [];
    if (/\btasks?\b/.test(lowered)) {
      var lines = text.split("\n").map(function (l) { return l.replace(/^[\s\-*]+/, "").trim(); })
                      .filter(Boolean).slice(0, 10);
      lines.forEach(function (l) { addTask(l.slice(0, 120)); });
      parts.push("I added " + lines.length + (lines.length === 1 ? " task" : " tasks") + " to your list, sir.");
    } else {
      parts.push(cut(text));
    }
    if (/\b(save|note)\b/.test(lowered) || text.length > 600) {
      addNote(text);
      parts.push("I saved the full text as a note.");
    }
    history.push({ role: "assistant", content: "I read this text through the camera: " + text.slice(0, 1500) });
    return parts.join(" ");
  }

  // ---------- what to do with what sir said ----------
  async function route(text) {
    // take off a leading "Hey Jarvis"
    text = text.replace(/^\s*(?:hey |hi |ok |okay )?jarvis[,.!?\s]*/i, "").trim();
    var t = text.toLowerCase();
    var m;
    if (!t) { return "Yes, sir?"; }

    // JARVIS asked a question and is waiting for the answer.
    // A normal command always breaks out of the waiting.
    if (pending && Date.now() - pending.at > 45000) { pending = null; }
    if (pending) {
      var p = pending;
      pending = null;
      var isCommand = /^(open|launch|start|go to|play|call|phone|ring|dial|read|look|scan|what|who|how|why|add|new|remind|note|save|take|finish|complete|remove|delete)\b/.test(t);
      if (/^cancel\b/.test(t)) { return "Cancelled, sir."; }
      if (!isCommand) {
        if (p.type === "song") { return await playMusic(text); }
        if (p.type === "call") { return callContact(text); }
        if (p.type === "number") {
          var d = spokenDigits(text).replace(/[^\d+]/g, "");
          if (d.replace(/\D/g, "").length >= 7) { return saveNumberAndCall(p.name, text); }
          if ((p.tries || 0) < 1) {
            pending = { type: "number", name: p.name, at: Date.now(), tries: 1 };
            return "I need the digits of the number, sir. Say them again, or say cancel.";
          }
          return "Never mind, sir. Tell me when you have the number.";
        }
      }
    }

    // fast commands: no waiting for the AI, so Android still allows the app to open
    if ((m = t.match(/^play(?: me)?\s*(.*)$/))) { return await playMusic(m[1]); }
    if ((m = t.match(/^(?:call|phone|ring|dial)\s+(.+)$/))) { return callContact(m[1]); }
    if ((m = t.match(/^(?:open|launch|start|go to)\s+(.+)$/)) && appKey(m[1])) { return await openApp(m[1]); }

    if (/\b(read this|read that|what does it say|what is written|read the text)\b/.test(t)) {
      return await camera("read", text);
    }
    if (/\b(what do you see|what can you see|look at this|scan|what is this|describe this)\b/.test(t)) {
      return await camera("look", text);
    }
    if ((m = t.match(/^(?:add|new) (?:a )?task (?:to |that )?(.+)/)) ||
        (m = t.match(/^remind me to (.+)/))) {
      return addTask(m[1]);
    }
    if (/\b(my tasks|list (my )?tasks|what are my tasks|open tasks)\b/.test(t)) { return listTasks(); }
    if ((m = t.match(/\b(?:finish|complete|remove|delete|tick off)(?: task)?(?: number)? (\d+)/))) {
      return finishTask(parseInt(m[1], 10));
    }
    if ((m = t.match(/^(?:save a note|take a note|note)[:,]? (.+)/))) { return addNote(m[1]); }
    if (/\b(my notes|read my notes|list notes)\b/.test(t)) { return listNotes(); }
    if (/\b(what('s| is) the time|what time is it)\b/.test(t)) {
      return "It is " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ", sir.";
    }
    if (!cfg.key) { var e1 = new Error("Add your Groq key in settings first, sir."); e1.friendly = true; throw e1; }
    return await ask(text);
  }

  async function handleText(text) {
    stopWake();
    hideTap();
    addMessage("You", text);
    setState("thinking");
    var reply, failed = false;
    silentReply = false;
    try { reply = await route(text); }
    catch (e) { reply = friendlyError(e); failed = true; }
    addMessage("JARVIS", reply);
    var quiet = silentReply;
    silentReply = false;
    setState(failed ? "error" : (quiet ? "idle" : "speaking"));
    if (!quiet) { await speak(reply); }
    setState("idle");
    resumeWake();
  }

  async function conversation() {
    if (talking) {
      talking = false;
      stopSpeaking();
      try { if (currentRec) { currentRec.abort(); } } catch (e) {}
      setState("idle");
      resumeWake();
      return;
    }
    if (!cfg.key) { openSettings(); return; }
    stopWake();
    talking = true;
    var quiet = 0;
    while (talking) {
      setState("listening");
      var r = await listenOnce();
      if (!talking) { break; }
      if (r.error === "not-allowed" || r.error === "service-not-allowed") {
        addMessage("JARVIS", "The microphone is blocked. Allow it in the browser settings, then tap Talk again, sir.");
        break;
      }
      if (r.error === "nosupport") {
        addMessage("JARVIS", "This browser cannot listen. Use Chrome, or type below, sir.");
        break;
      }
      if (r.error === "network") {
        addMessage("JARVIS", "Listening needs the internet, sir. You can still type commands below.");
        break;
      }
      if (!r.text) {
        quiet += 1;
        if (quiet >= 4) { break; }
        continue;
      }
      if (isEcho(r.text)) { continue; }   // that was JARVIS's own voice
      quiet = 0;
      var words = r.text.toLowerCase().split(/\s+/).map(function (w) { return w.replace(/[.,!?]/g, ""); });
      if (words.length <= 3 && words.some(function (w) { return w === "stop" || w === "goodbye" || w === "bye"; })) {
        addMessage("You", r.text);
        addMessage("JARVIS", "Understood, sir.");
        break;
      }
      await handleText(r.text);
      await sleep(700);   // let the sound fade before listening again
    }
    talking = false;
    setState("idle");
    resumeWake();
  }

  // Ask one question out loud, then listen for the answer
  async function askAndListen(question, type) {
    if (talking) { return; }
    stopWake();
    pending = { type: type, at: Date.now() };
    addMessage("JARVIS", question);
    setState("speaking");
    await speak(question);
    await sleep(600);
    setState("listening");
    var r = await listenOnce();
    setState("idle");
    if (r.text && !isEcho(r.text)) { await handleText(r.text); }
    else { pending = null; resumeWake(); }
  }

  // ---------- buttons ----------

    $("setModel").value = cfg.model;

  $("musicBtn").addEventListener("click", function () { askAndListen("What should I play, sir?", "song"); });
  $("callBtn").addEventListener("click", function () { askAndListen("Who should I call, sir?", "call"); });
  $("lookBtn").addEventListener("click", function () { handleText("What do you see?"); });

  $("wakeBtn").addEventListener("click", function () {

  // The app dock: one tap opens the real app
  Object.keys(APPS).forEach(function (key) {
    var b = document.createElement("button");
    b.className = "chip";
    b.textContent = APPS[key].label;
    b.addEventListener("click", async function () {

  function sendTyped() {
    var box = $("text");
    var value = box.value.trim();
    if (!value) { return; }
    box.value = "";
    handleText(value);
  }
  $("sendBtn").addEventListener("click", sendTyped);
  $("text").addEventListener("keydown", function (e) { if (e.key === "Enter") { sendTyped(); } });

  addMessage("JARVIS", cfg.key
    ? "JARVIS online, sir. Tap Talk, or type, and tell me what you need."
    : "JARVIS online, sir. Open Settings and add your Groq key to begin.");

  // ---------- the orb: geodesic core, pumping ring, bumping outer layer ----------
  var FPS = 30;
  var orb = $("orb");
  var oc = orb.getContext("2d");
  var W = 0, H = 0, CX = 0, CY = 0, R = 100, dpr = 1;

  function resizeOrb() {
    var box = orb.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = box.width;
    H = box.height;
    orb.width = Math.round(W * dpr);
    orb.height = Math.round(H * dpr);
    CX = W / 2;
    CY = H / 2;
    R = Math.min(W, H) * 0.44;
  }
  window.addEventListener("resize", resizeOrb);
  resizeOrb();

  var TARGET = {
    idle:      { spin: 0.25, pump: 0.10, bump: 0.03, ball: 0.30, glow: 0.5 },
    listening: { spin: 0.70, pump: 0.35, bump: 0.07, ball: 0.70, glow: 0.8 },
    thinking:  { spin: 1.20, pump: 0.25, bump: 0.22, ball: 1.40, glow: 0.9 },
    speaking:  { spin: 0.90, pump: 0.85, bump: 0.10, ball: 1.80, glow: 1.0 },
    error:     { spin: 0.30, pump: 0.15, bump: 0.12, ball: 0.40, glow: 0.7 }
  };
  var cur = { spin: 0.25, pump: 0.10, bump: 0.03, ball: 0.30, glow: 0.5 };

  var DOTS = 84;
  var PTS = [];
  var i, a, b;
  for (i = 0; i < DOTS; i++) {
    var py = 1 - 2 * (i + 0.5) / DOTS;
    var pr = Math.sqrt(1 - py * py);
    var pa = i * 2.399963;
    PTS.push([Math.cos(pa) * pr, py, Math.sin(pa) * pr]);
  }
  var EDGES = [];
  for (a = 0; a < DOTS; a++) {
    for (b = a + 1; b < DOTS; b++) {
      var dx = PTS[a][0] - PTS[b][0], dy = PTS[a][1] - PTS[b][1], dz = PTS[a][2] - PTS[b][2];
      if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 0.52) { EDGES.push([a, b]); }
    }
  }
  var FLOAT = [];
  for (i = 0; i < 120; i++) {
    FLOAT.push({
      a: Math.random() * 6.2832, k: Math.random() < 0.5 ? 0 : 1,
      j: Math.random() * 2 - 1, s: 0.05 + Math.random() * 0.12,
      size: 0.7 + Math.random() * 1.2
    });
  }

  var T = 0, last = 0, ballAngle = 0, ringAngle = 0;

  function layerR(angle, k) {
    var beat = 0.75 + 0.25 * Math.sin(T * (4 + cur.bump * 20));
    var amp = R * cur.bump * 0.28 * beat;
    return R * (0.93 + 0.05 * k) + amp * (
      Math.sin(angle * 5 + T * (1.5 + k) + k * 2) +
      0.7 * Math.sin(angle * 8 - T * 2.3) +
      0.5 * Math.sin(angle * 3 + T * 1.1)
    );
  }

  function frameOrb(now) {
    requestAnimationFrame(frameOrb);
    if (now - last < 1000 / FPS) { return; }
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    T += dt;

    var state = document.body.dataset.state || "idle";
    var goal = TARGET[state] || TARGET.idle;
    for (var key in goal) { cur[key] += (goal[key] - cur[key]) * 0.08; }
    var rgb = state === "error" ? "255,59,59" : "53,214,214";

    oc.setTransform(dpr, 0, 0, dpr, 0, 0);
    oc.clearRect(0, 0, W, H);

    var glow = oc.createRadialGradient(CX, CY, R * 0.05, CX, CY, R * 0.95);
    glow.addColorStop(0, "rgba(" + rgb + "," + (0.22 * cur.glow) + ")");
    glow.addColorStop(0.6, "rgba(" + rgb + "," + (0.08 * cur.glow) + ")");
    glow.addColorStop(1, "rgba(" + rgb + ",0)");
    oc.fillStyle = glow;
    oc.beginPath();
    oc.arc(CX, CY, R * 0.95, 0, 6.2832);
    oc.fill();

    var k, n;
    for (k = 0; k < 2; k++) {
      oc.beginPath();
      for (n = 0; n <= 100; n++) {
        var ang = (n / 100) * 6.2832;
        var rr = layerR(ang, k);
        var lx = CX + Math.cos(ang) * rr, ly = CY + Math.sin(ang) * rr;
        if (n === 0) { oc.moveTo(lx, ly); } else { oc.lineTo(lx, ly); }
      }
      oc.closePath();
      oc.strokeStyle = "rgba(" + rgb + "," + (k === 0 ? 0.65 : 0.3) + ")";
      oc.lineWidth = 1.2;
      oc.stroke();
    }
    oc.fillStyle = "rgba(" + rgb + ",0.75)";
    for (n = 0; n < FLOAT.length; n++) {
      var q = FLOAT[n];
      var pang = q.a + T * q.s * (0.3 + cur.spin * 0.5);
      var prad = layerR(pang, q.k) + q.j * R * 0.03;
      oc.beginPath();
      oc.arc(CX + Math.cos(pang) * prad, CY + Math.sin(pang) * prad, q.size, 0, 6.2832);
      oc.fill();
    }

    oc.lineWidth = 1;
    oc.strokeStyle = "rgba(" + rgb + ",0.35)";
    oc.setLineDash([2, 8]);
    oc.lineDashOffset = -T * 20 * (0.5 + cur.spin);
    oc.beginPath();
    oc.arc(CX, CY, R * 0.86, 0, 6.2832);
    oc.stroke();
    oc.setLineDash([30, 12, 6, 12]);
    oc.lineDashOffset = T * 30 * (0.5 + cur.spin);
    oc.beginPath();
    oc.arc(CX, CY, R * 0.46, 0, 6.2832);
    oc.stroke();
    oc.setLineDash([]);

    var SEG = 48, step = 6.2832 / SEG, r1 = R * 0.50, r2 = R * 0.78;
    ringAngle -= dt * cur.spin * 0.35;
    for (n = 0; n < SEG; n++) {
      var a0 = ringAngle + n * step, a1 = a0 + step * 0.78;
      var wave = 0.5 + 0.5 * Math.sin(T * (3 + cur.pump * 14) + n * 0.9 + Math.sin(T * 2 + n * 0.4) * 1.5);
      var level = Math.min(0.35 + cur.pump * wave * 0.8 + 0.1 * Math.sin(T + n), 1.15);
      var ro = r1 + (r2 - r1) * level;
      oc.beginPath();
      oc.arc(CX, CY, ro, a0, a1);
      oc.arc(CX, CY, r1, a1, a0, true);
      oc.closePath();
      oc.fillStyle = "rgba(" + rgb + "," + (0.18 + 0.5 * Math.min(level, 1)) + ")";
      oc.fill();
    }

    ballAngle += dt * cur.ball;
    var rs = R * 0.30 * (1 + 0.05 * cur.pump * Math.sin(T * 12));
    var ca = Math.cos(ballAngle), sa = Math.sin(ballAngle), ct = Math.cos(0.4), st = Math.sin(0.4);
    var P = [];
    for (n = 0; n < DOTS; n++) {
      var x = PTS[n][0], y = PTS[n][1], z = PTS[n][2];
      var x1 = x * ca + z * sa, z1 = -x * sa + z * ca;
      P.push([CX + x1 * rs, CY + (y * ct - z1 * st) * rs, y * st + z1 * ct]);
    }
    oc.beginPath();
    oc.arc(CX, CY, rs, 0, 6.2832);
    oc.fillStyle = "rgba(" + rgb + ",0.10)";
    oc.fill();
    oc.strokeStyle = "rgba(" + rgb + ",0.7)";
    oc.lineWidth = 1.5;
    oc.stroke();
    oc.lineWidth = 0.8;
    for (n = 0; n < EDGES.length; n++) {
      var pa1 = P[EDGES[n][0]], pb1 = P[EDGES[n][1]];
      var depth = (pa1[2] + pb1[2]) / 2;
      oc.strokeStyle = "rgba(" + rgb + "," + (0.12 + 0.5 * (depth + 1) / 2) + ")";
      oc.beginPath();
      oc.moveTo(pa1[0], pa1[1]);
      oc.lineTo(pb1[0], pb1[1]);
      oc.stroke();
    }
  }
  requestAnimationFrame(frameOrb);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
